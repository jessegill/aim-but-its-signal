# Packaging — macOS, Apple Silicon only, minimum macOS 15 (Sequoia).
#
# Run with: npm run package   (typechecks, builds, then produces release/*.dmg)
#
# Kept in YAML rather than package.json so the decisions below can carry their reasoning.

appId: dev.aimgnal.app
productName: AIMgnal
copyright: Copyright © 2026

directories:
  # Outside the repository on purpose. The repo lives in iCloud Drive, which tags every file in
  # it with extended attributes (com.apple.fileprovider…, FinderInfo); codesign refuses to sign a
  # bundle carrying them ("resource fork, Finder information, or similar detritus not allowed"),
  # and iCloud re-adds them faster than they can be stripped. The .dmg lands here.
  output: ${env.HOME}/Library/Caches/AIMgnal/release
  buildResources: resources

files:
  - out/**/*
  - resources/**/*
  - package.json

# The SQLite driver loads a .node binary at runtime, which cannot be read from inside
# app.asar. Anything in `dependencies` that ships a native addon belongs here.
#
# The driver is better-sqlite3-multiple-ciphers (SQLCipher). Plain better-sqlite3 accepts
# `PRAGMA cipher` / `PRAGMA hexkey` silently and then writes cleartext, so it cannot satisfy
# SPEC.md §8's encryption-at-rest requirement. Keep this path in sync with
# package.json > dependencies.
asarUnpack:
  - "**/node_modules/better-sqlite3-multiple-ciphers/**"
  # Message sounds are played by macOS `afplay` (src/main/service.ts), which cannot read inside
  # an asar archive.
  - "resources/sounds/**"

# Rebuilding is handled by `postinstall` (@electron/rebuild), which downloads the publisher's
# Electron-ABI prebuild rather than compiling. Leaving electron-builder's own rebuild off keeps
# a single owner for that step.
#
# ABI PIN — READ BEFORE BUMPING ELECTRON: better-sqlite3-multiple-ciphers is NOT a Node-API
# addon, so its binary is tied to one NODE_MODULE_VERSION. v12.11.1 publishes Electron
# prebuilds only up to ABI 146, which is Electron 42. Electron 43 is ABI 148 and has no
# prebuild — bumping past 42 forces a from-source node-gyp build, which currently fails
# because this repository's path contains an apostrophe (see .npmrc).
npmRebuild: false

# Clears iCloud's extended attributes from the bundle before signing. See the script.
afterPack: scripts/after-pack.cjs

mac:
  category: public.app-category.social-networking

  # arm64 only. No universal binary and no x64 slice — roughly halves artifact size and
  # build time, and the project targets Apple Silicon exclusively.
  target:
    - target: dmg
      arch:
        - arm64

  # Hard floor. The app refuses to launch on older systems rather than failing obscurely.
  minimumSystemVersion: "15.0"
  extendInfo:
    LSMinimumSystemVersion: "15.0"

  icon: resources/icons/AIMgnal.icns

  # ---------------------------------------------------------------------------
  # Code signing and notarization
  # ---------------------------------------------------------------------------
  # Signed with the "Developer ID Application" certificate in the login keychain (found
  # automatically; set CSC_NAME to pick one if there are several) and notarized by Apple, so the
  # .dmg opens on any Mac without a Gatekeeper warning.
  #
  # Notarization credentials come from a notarytool keychain profile, never from this file or
  # the environment's plain text:
  #   xcrun notarytool store-credentials AIMgnal-notary --apple-id … --team-id …
  #   APPLE_KEYCHAIN_PROFILE=AIMgnal-notary npm run package
  #
  # `npm run package:unsigned` builds without either, for a quick local test.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true

dmg:
  writeUpdateInfo: false
  # Signed like the app; scripts/notarize-dmg.sh then notarizes and staples it.
  sign: true
